<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>caelus example</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      section { margin-bottom: 1.5rem; }
      h2 { font-size: 1rem; margin: 0 0 0.5rem; }
      #count { font-size: 3rem; font-weight: 600; }
      #buttons button { margin-right: 0.5rem; }
      textarea { width: 100%; height: 8rem; font-family: ui-monospace, monospace; }
      #status { color: #666; }
      #status.failed { color: #b00; }
      #log { height: 8rem; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 13px; background: #f4f4f4; padding: 0.5rem; }
      td { padding-right: 1rem; }
    </style>
  </head>
  <body>
    <h1>caelus</h1>
    <p>One registry. Buttons and key chords both dispatch through it.</p>

    <section>
      <div id="count">0</div>
      <div id="buttons"></div>
    </section>

    <section>
      <h2>Bindings</h2>
      <table id="table"></table>
    </section>

    <section>
      <h2>User keymap (TOML)</h2>
      <textarea id="keymap" spellcheck="false"></textarea>
      <div><button id="reload">Reload</button> <span id="status"></span></div>
    </section>

    <section>
      <h2>Log</h2>
      <div id="log"></div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
