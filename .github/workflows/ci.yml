name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # builds every package and type-checks the docs snippets, then tests
      - run: npm test
      # the release builds the docs too; a dead link fails here first. After the tests, because TypeDoc
      # reads the adapters' imports of core from the built dist/
      - run: npm run build -w site
