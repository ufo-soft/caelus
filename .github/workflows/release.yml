name: Release

# Triggered by a v* tag. All packages share one version: bump with
# `npm version <patch|minor|major> --workspaces --no-git-tag-version`, commit, tag, push --follow-tags.
# Publishes every public workspace package via trusted publishing (OIDC, no token secret)
# and creates the GitHub Release for the same commit.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1+; node 22 ships an older one
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Publish each package whose version is not on the registry yet, so a version published by hand
      # (the first one of any package must be) does not make the tag fail.
      - run: |
          for dir in packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
            else
              npm publish -w "$dir" --provenance
            fi
          done
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
