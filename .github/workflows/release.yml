name: Release

# Triggered by publishing a GitHub Release, whose tag (vX.Y.Z) is the version: the packages say 0.0.0
# in the repo, and this stamps the tag's version into them, and into the adapters' range on core,
# before publishing. Publishes every package via trusted publishing (OIDC, no token secret), then
# the docs site for the tag.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1+; node 22 ships an older one
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Only the copy being published carries the version; nothing is committed back.
      - name: Stamp the version from the tag
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          npm pkg set version="$version" -w packages/caelus -w packages/cli -w packages/mcp
          npm pkg set "dependencies.@ufo-soft/caelus=^$version" -w packages/cli -w packages/mcp
      # Publish each package whose version is not on the registry yet, so a version published by hand
      # (the first one of any package must be), or a re-run, does not fail the release.
      - run: |
          for dir in packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
            else
              npm publish -w "$dir" --provenance
            fi
          done

  # The docs site at caelus.ufosoft.dev, one folder per minor version: v0.1.3 builds /v0.1/, replacing
  # the earlier patch's. The newest tag also builds the root; a patch to an older minor leaves it alone.
  # infra/ is applied by hand and its role can only sync the bucket and invalidate, so that is all this
  # does. The three SITE_* repository variables are infra/'s outputs.
  docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # two tags pushed together must not interleave their root syncs
    concurrency:
      group: docs
      cancel-in-progress: false
    env:
      BUCKET: ${{ vars.SITE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag: the newest-tag check and versions.json read them
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SITE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Build and sync
        run: |
          set -euo pipefail
          # Hashed files under assets/ never change; everything else is revalidated on every request.
          # Each pass deletes only its own kind of file, since --delete honours --exclude.
          sync() {
            local prefix=$1
            shift
            aws s3 sync site/.vitepress/dist "s3://$BUCKET/$prefix" --delete --exclude 'assets/*' "$@" \
              --cache-control 'public, max-age=0, must-revalidate'
            aws s3 sync site/.vitepress/dist/assets "s3://$BUCKET/${prefix}assets" --delete \
              --cache-control 'public, max-age=31536000, immutable'
          }

          minor=$(cut -d. -f1,2 <<< "$GITHUB_REF_NAME")
          npm run build -w site -- --base "/$minor/"
          sync "$minor/"

          newest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then
            npm run build -w site
            # the root's --delete must not reach the version folders or versions.json
            sync '' --exclude 'v[0-9]*' --exclude versions.json
          fi
      # Rewritten whole from the tags, newest first, so it cannot drift: ["v0.2", "v0.1"]. The switcher
      # in every build reads it at runtime.
      - name: Write versions.json
        run: |
          set -euo pipefail
          git tag -l 'v*' --sort=-v:refname | cut -d. -f1,2 | uniq | jq -R . | jq -cs . \
            | aws s3 cp - "s3://$BUCKET/versions.json" \
                --content-type application/json --cache-control 'public, max-age=0, must-revalidate'
      - run: aws cloudfront create-invalidation --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" --paths '/*'
